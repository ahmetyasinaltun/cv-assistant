# Local development infrastructure: a single PostgreSQL instance for the API.
services:
  db:
    image: postgres:16-alpine
    container_name: career_assistant_db
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: career_assistant
    ports:
      - "5434:5432"
    volumes:
      - career_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  career_db_data:
