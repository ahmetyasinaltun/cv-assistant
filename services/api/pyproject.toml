[project]
name = "ai-career-assistant-api"
version = "0.1.0"
description = "FastAPI backend for AI Career Assistant: auth, resume/job ingestion, AI match analysis."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    # 6.21.4 fixes known denial-of-service issues on crafted PDFs; uploads are untrusted.
    "pypdf>=6.21.4",
    "google-genai>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Security floor for a dependency of google-auth (known decoding issues before 0.6.5).
    "pyasn1>=0.6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Formatter wraps code; long lines that remain are header comments and message strings.
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.md", "ai/eval/cases/*.json"]
