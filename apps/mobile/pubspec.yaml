name: career_assistant
description: "Flutter client of AI Career Assistant; uses the same API as the web client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    # The fictional sample result also shown on the web, exported from apps/web.
    - assets/sample/sample_analysis.json
  fonts:
    # One variable file (weight and width axes, SIL OFL, see assets/fonts/OFL.txt). It is listed per weight
    # so Flutter finds an exact match and never fakes bold on top of the weight axis.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
          weight: 400
        - asset: assets/fonts/Archivo.ttf
          weight: 500
        - asset: assets/fonts/Archivo.ttf
          weight: 600
